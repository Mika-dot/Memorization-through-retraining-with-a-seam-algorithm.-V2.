[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mtrsa-v3"
version = "3.0.0a1"
description = "Experimental seam-aware per-image neural image codec"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "Pillow>=10.0",
  "torch>=2.2",
]

[project.scripts]
mtr3 = "mtr3.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mtr3*"]
